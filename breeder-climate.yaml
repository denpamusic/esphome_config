text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    mac_address:
      name: "MAC Address"
  
  - platform: template
    name: "Display 1 MAC Address"
    lambda: 'return {"${display1_mac}"};'
    entity_category: diagnostic
    disabled_by_default: true

  - platform: template
    name: "Display 2 MAC Address"
    lambda: 'return {"${display2_mac}"};'
    entity_category: diagnostic
    disabled_by_default: true

  - platform: pid_autotune
    climate_id: climate_control1
    status:
      id: autotune_status1
      name: "Channel 1 Autotune Status"
      on_value:
        then:
          - script.execute:
              id: update_leds
              channel: 1
          - rtttl.play:
              id: buzzer
              rtttl: !lambda "return id(autotune_rtttl_map)[x];"
    error_message:
      name: "Channel 1 Autotune Error"
    update_interval: 5s

  - platform: pid_autotune
    climate_id: climate_control2
    status:
      id: autotune_status2
      name: "Channel 2 Autotune Status"
      on_value:
        then:
          - script.execute:
              id: update_leds
              channel: 2
          - rtttl.play:
              id: buzzer
              rtttl: !lambda "return id(autotune_rtttl_map)[x];"
    error_message:
      name: "Channel 2 Autotune Error"
    update_interval: 5s

climate:
  - platform: pid
    id: climate_control1
    name: "Channel 1 Climate Controller"
    sensor: probe1_temperature
    humidity_sensor: probe1_humidity
    default_target_temperature: ${initial_target}
    heat_output: heat_control_proxy1
    visual:
      min_temperature: ${min_temperature}
      max_temperature: ${max_temperature}
    control_parameters:
      kp: ${initial_kp}
      ki: ${initial_ki}
      kd: ${initial_kd}
      output_averaging_samples: 5
      derivative_averaging_samples: 5
      min_integral: 0 # Heating only
      starting_integral_term: 0.5
    on_state:
      then:
        - script.execute:
            id: update_leds
            channel: 1
        - if:
            condition:
              and:
                - lambda: "return x.mode != CLIMATE_MODE_OFF;"
                - switch.is_on: manual_override1
            then:
              - switch.turn_off: manual_override1
            
  - platform: pid
    id: climate_control2
    name: "Channel 2 Climate Controller"
    sensor: probe2_temperature
    humidity_sensor: probe2_humidity
    default_target_temperature: ${initial_target}
    heat_output: heat_control_proxy2
    visual:
      min_temperature: ${min_temperature}
      max_temperature: ${max_temperature}
    control_parameters:
      kp: ${initial_kp}
      ki: ${initial_ki}
      kd: ${initial_kd}
      output_averaging_samples: 5
      derivative_averaging_samples: 5
      min_integral: 0 # Heating only
      starting_integral_term: 0.5
    on_state:
      then:
        - script.execute:
            id: update_leds
            channel: 2
        - if:
            condition:
              and:
                - lambda: "return x.mode != CLIMATE_MODE_OFF;"
                - switch.is_on: manual_override2
            then:
              - switch.turn_off: manual_override2