    id: climate_control1_kp
    name: "Channel 1 PID Kp"
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${initial_kp}
    min_value: 0.0
    max_value: 100.0
    step: 0.00001
    entity_category: config
    on_value:
