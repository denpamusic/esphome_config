substitutions:
  name: breeder-climate
  friendly_name: Breeder Climate Controller

  # [Project]
  manufacturer: "lolin"
  project_name: "pid-climate-controller"
  version: "1.0.1"

  # [Display]
  display1_mac: !secret breeder_climate__display1_mac
  display2_mac: !secret breeder_climate__display2_mac
  display_heartbeat: 30min
  display_validity_period: 35min
  display_temperature_delta: 0.2
  display_humidity_delta: 5.0

  # [PID]
  pwm_period: 10s
  measure_interval: 2s
  oversampling: 5  # update_interval = measure_interval * oversampling
  initial_kp: 0.0
  initial_ki: 0.0
  initial_kd: 0.0
  initial_target: 30°C
  min_temperature: 20°C
  max_temperature: 32°C
  deadband: 0.15°C

  # [SSR]
  temperature_threshold: 33

  # [Tunes]
  tune_confirm: "system_confirm:d=8,o=5,b=160:g,d6"
  tune_autotune_start: "autotune_start:d=8,o=5,b=200:c,e,g,c6"
  tune_autotune_success: "autotune_success:d=8,o=5,b=200:c6,e6,g6,c7"
  tune_autotune_fail: "autotune_fail:d=4,o=5,b=120:g,e,c"
  tune_sensor_fail: "sensor_fail:d=8,o=6,b=400:b,c7,b,c7,b,c7,p"
  tune_silence: "silence:d=4,o=5,b=125:128p"

  # [GPIOs]
  relay1_pin: GPIO18
  temperature_probe1_pin: GPIO11
  temperature_probe1_power_pin: GPIO10
  green_led1_pin: GPIO44
  red_led1_pin: GPIO43
  relay2_pin: GPIO16
  temperature_probe2_pin: GPIO2
  temperature_probe2_power_pin: GPIO13
  green_led2_pin: GPIO35
  red_led2_pin: GPIO36
  buzzer_pin: GPIO12
  rgb_led_pin: GPIO47
  
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.4.0
  project:
    name: "${manufacturer}.${project_name}"
    version: ${version}
  on_boot:
    - priority: 600
      then:
        - light.turn_on:
            id: green_led1
            effect: "Fast Blink"
        - light.turn_on:
            id: green_led2
            effect: "Fast Blink"
        - light.turn_on:
            id: red_led1
            effect: "Fast Blink"
        - light.turn_on:
            id: red_led2
            effect: "Fast Blink"
    - priority: -100
      then:
        - climate.pid.set_control_parameters:
            id: climate_control1
            kp: !lambda return id(climate_control1_kp).state;
            ki: !lambda return id(climate_control1_ki).state;
            kd: !lambda return id(climate_control1_kd).state;
        - climate.pid.set_control_parameters:
            id: climate_control2
            kp: !lambda return id(climate_control2_kp).state;
            ki: !lambda return id(climate_control2_ki).state;
            kd: !lambda return id(climate_control2_kd).state;
        - script.execute: mark_boot_done
            
esp32:
  variant: ESP32S3
  board: lolin_s3_mini
  framework:
    type: esp-idf

psram:
  mode: quad
  speed: 80MHz

esp32_ble:
  use_psram: true

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption: 
    key: !secret breeder_climate__api_key

# Allow Over-The-Air updates
ota:
- platform: esphome
  password: !secret breeder_climate__ota_password

mdns: 

mapping:
  - id: autotune_rtttl_map
    from: string
    to: string
    default_value: ${tune_silence}
    entries:
      "Running": ${tune_autotune_start}
      "Finished": ${tune_autotune_success}
      "Failed": ${tune_autotune_fail}
  
external_components:
  - source: github://denpavibes/esphome-pid-autotune-status
    refresh: never
    
wifi:
  ssid: !secret wifi_iot_ssid
  password: !secret wifi_iot_password
  ap:
    ssid: "${name} Fallback Hotspot"
    password: !secret breeder_climate__fallback_password
  reboot_timeout: 1h
  use_psram: true

captive_portal:

globals:
  - id: boot_done
    type: bool
    restore_value: false
    initial_value: "false"

  - id: last_temp1
    type: float
    restore_value: false
    initial_value: "NAN"

  - id: last_temp2
    type: float
    restore_value: false
    initial_value: "NAN"

  - id: led_lock1
    type: bool
    restore_value: false
    initial_value: "true"

  - id: led_lock2
    type: bool
    restore_value: false
    initial_value: "true"
  
script:
  - id: mark_boot_done
    mode: single
    then:
      - delay: 3s
      - globals.set:
          id: boot_done
          value: "true"
      - script.execute:
          id: update_leds
          channel: 1
      - script.execute:
          id: update_leds
          channel: 2
      - script.execute:
          id: check_relay
          channel: 1
      - script.execute:
          id: check_relay
          channel: 2
      - script.execute: trigger_alarm

  - id: queue_display1_update
    mode: restart
    then:
      - delay: 1s
      - component.update: pvvx_display1

  - id: queue_display2_update
    mode: restart
    then:
      - delay: 1s
      - component.update: pvvx_display2
              
  - id: check_relay
    mode: queued
    parameters:
      channel: int
    then:
      - lambda: |-
          if (!id(boot_done)) return;
          
          float *previous_temperature;
          float current_temperature;
          float heat_level;
          binary_sensor::BinarySensor *fault_sensor;

          if (channel == 1) {
            current_temperature = id(probe1_temperature).state;
            previous_temperature = &id(last_temp1);
            heat_level = id(heat_level1).state;
            fault_sensor = id(relay1_runaway);
          } else if (channel == 2) {
            current_temperature = id(probe2_temperature).state;
            previous_temperature = &id(last_temp2);
            heat_level = id(heat_level2).state;
            fault_sensor = id(relay2_runaway);
          } else {
            return; // Invalid channel
          }

          if (isnan(current_temperature)) {
            fault_sensor->invalidate_state();
            *previous_temperature = NAN;
            return;
          };

          if (heat_level == 0.0 && current_temperature > ${temperature_threshold}) {
            if (!isnan(*previous_temperature)) {
              if (current_temperature >= (*previous_temperature - 0.5)) {
                fault_sensor->publish_state(true);
              } else {
                fault_sensor->publish_state(false);
              }
            }
            *previous_temperature = current_temperature;
          } else {
            fault_sensor->publish_state(false);
            *previous_temperature = NAN;
          }

  - id: update_leds
    mode: queued
    parameters:
      channel: int
    then:
      - lambda: |-
          if(!id(boot_done)) return;

          bool is_autotune;
          bool is_climate_off;
          bool is_sensor_connected;
          bool is_runaway;
          bool is_heater_off;
          bool *led_lock;
          light::LightState *green_led;
          light::LightState *red_led;
          std::string new_effect;

          if (channel == 1) {
            is_autotune = id(autotune_status1).state == "Running";
            is_climate_off = id(climate_control1).mode == CLIMATE_MODE_OFF;
            is_sensor_connected = id(sensor1_connected).state;
            is_heater_off = id(heat_level1).state == 0.0;
            is_runaway = id(relay1_runaway).state;
            green_led = id(green_led1);
            red_led = id(red_led1);
            led_lock = &id(led_lock1);
          } else if (channel == 2) {
            is_autotune = id(autotune_status2).state == "Running";
            is_climate_off = id(climate_control2).mode == CLIMATE_MODE_OFF;
            is_sensor_connected = id(sensor2_connected).state;
            is_heater_off = id(heat_level2).state == 0.0;
            is_runaway = id(relay2_runaway).state;
            green_led = id(green_led2);
            red_led = id(red_led2);
            led_lock = &id(led_lock2);
          } else {
            return; // Invalid channel
          }

          // Handle red led
          if (is_heater_off && !is_runaway) {
            red_led->turn_off().perform();
            *led_lock = false;
          } else {
            bool led_is_locked = *led_lock;
            if (is_runaway) {
              new_effect = "Fast Blink";
              *led_lock = true;
            } else {
              new_effect = "None";
              *led_lock = false;
            }

            if ((led_is_locked && new_effect == "None") || red_led->get_effect_name() != new_effect) {
              auto call = red_led->turn_on();
              call.set_effect(new_effect);
              call.perform();
            }
          }

          // Handle green led
          if (is_climate_off && !is_autotune) {
            green_led->turn_off().perform();
          } else {
            if (!is_sensor_connected) {
              new_effect = "Fast Blink";
            } else if (is_autotune) {
              new_effect = "Slow Pulse";
            } else {
              new_effect = "None";
            }

            if (new_effect == "None" || green_led->get_effect_name() != new_effect) {
              auto call = green_led->turn_on();
              call.set_effect(new_effect);
              call.perform();
            }
          }

  - id: trigger_alarm
    mode: single
    then:
      - while:
          condition:
            or:
              - lambda: "return id(climate_control1).mode != CLIMATE_MODE_OFF && !id(sensor1_connected).state;"
              - lambda: "return id(climate_control2).mode != CLIMATE_MODE_OFF && !id(sensor2_connected).state;"
              - lambda: "return id(relay1_runaway).state || id(relay2_runaway).state;"
          then:
            - rtttl.play:
                id: buzzer
                rtttl: ${tune_sensor_fail}
            - wait_until:
                condition:
                  not:
                    rtttl.is_playing:
                      id: buzzer
            - delay: 500ms
      - rtttl.play:
          id: buzzer
          rtttl: ${tune_confirm}

interval:
  - interval: 5min
    then:
      - script.execute:
          id: check_relay
          channel: 1
      - script.execute:
          id: check_relay
          channel: 2
          
output:
  - platform: slow_pwm
    period: ${pwm_period}
    pin: ${relay1_pin}
    inverted: true
    id: heat_output1

  - platform: slow_pwm
    period: ${pwm_period}
    id: led_pwm1
    inverted: true
    turn_on_action:
      then:
        - if:
            condition:
              - lambda: "return !id(led_lock1);"
            then:
              - light.turn_off: red_led1
    turn_off_action:
      then:
        - if:
            condition:
              - lambda: "return !id(led_lock1);"
            then:
              - light.turn_on: red_led1

  - platform: template
    id: heat_monitor_proxy1
    type: float
    write_action:
      - output.set_level:
          id: heat_output1
          level: !lambda "return state;"
      - sensor.template.publish:
          id: heat_level1
          state: !lambda "return state;"
      - output.set_level:
          id: led_pwm1
          level: !lambda "return state;"
                
  - platform: template
    id: heat_control_proxy1
    type: float
    write_action:
      - if:
          condition:
            - switch.is_on: manual_override1
          then:
            - output.set_level:
                id: heat_monitor_proxy1
                level: 1.0
          else:
            - output.set_level:
                id: heat_monitor_proxy1
                level: !lambda "return state;"
                
  - platform: slow_pwm
    period: ${pwm_period}
    pin: ${relay2_pin}
    inverted: true
    id: heat_output2

  - platform: slow_pwm
    period: ${pwm_period}
    id: led_pwm2
    inverted: true
    turn_on_action:
      then:
        - if:
            condition:
              - lambda: "return !id(led_lock2);"
            then:
              - light.turn_off: red_led2
    turn_off_action:
      then:
        - if:
            condition:
              - lambda: "return !id(led_lock2);"
            then:
              - light.turn_on: red_led2
            
  - platform: template
    id: heat_monitor_proxy2
    type: float
    write_action:
      - output.set_level:
          id: heat_output2
          level: !lambda "return state;"
      - sensor.template.publish:
          id: heat_level2
          state: !lambda "return state;"
      - output.set_level:
          id: led_pwm2
          level: !lambda "return state;"
                
  - platform: template
    id: heat_control_proxy2
    type: float
    write_action:
      - if:
          condition:
            - switch.is_on: manual_override2
          then:
            - output.set_level:
                id: heat_monitor_proxy2
                level: 1.0
          else:
            - output.set_level:
                id: heat_monitor_proxy2
                level: !lambda "return state;"
           
  - platform: ledc
    pin: ${buzzer_pin}
    id: buzzer_pwm

  - platform: ledc
    pin: ${green_led1_pin}
    id: green_led1_output

  - platform: ledc
    pin: ${green_led2_pin}
    id: green_led2_output

  - platform: ledc
    pin: ${red_led1_pin}
    id: red_led1_output

  - platform: ledc
    pin: ${red_led2_pin}
    id: red_led2_output
    
rtttl:
  output: buzzer_pwm
  id: buzzer
    
light:
  - platform: esp32_rmt_led_strip
    id: ${rgb_led_pin}
    channel_colors: GRB
    pin: ${rgb_led_pin}
    num_leds: 1
    chipset: WS2812

  - platform: monochromatic
    id: green_led1
    output: green_led1_output
    default_transition_length: 0s
    effects:
      - strobe:
          name: "Fast Blink"
          colors:
            - state: true
              duration: 500ms
            - state: false
              duration: 500ms
      - pulse:
          name: "Slow Pulse"
          transition_length:
            on_length: 500ms
            off_length: 1.5s
          update_interval: 2s

  - platform: monochromatic
    id: red_led1
    output: red_led1_output
    default_transition_length: 0s
    effects:
      - strobe:
          name: "Fast Blink"
          colors:
            - state: true
              duration: 500ms
            - state: false
              duration: 500ms
          
  - platform: monochromatic
    id: green_led2
    output: green_led2_output
    default_transition_length: 0s
    effects:
      - strobe:
          name: "Fast Blink"
          colors:
            - state: true
              duration: 500ms
            - state: false
              duration: 500ms
      - pulse:
          name: "Slow Pulse"
          transition_length:
            on_length: 500ms
            off_length: 1.5s
          update_interval: 2s

  - platform: monochromatic
    id: red_led2
    output: red_led2_output
    default_transition_length: 0s
    effects:
      - strobe:
          name: "Fast Blink"
          colors:
            - state: true
              duration: 500ms
            - state: false
              duration: 500ms
          
esp32_ble_tracker:
  scan_parameters:
    active: false

ble_client:
  - mac_address: ${display1_mac}
    id: display1

  - mac_address: ${display2_mac}
    id: display2

button:
  - platform: restart
    name: "Restart Node"

  - platform: template
    name: "Channel 1 Reset Integral Term"
    on_press:
      then:
        - climate.pid.reset_integral_term: climate_control1
    entity_category: config

  - platform: template
    name: "Channel 2 Reset Integral Term"
    on_press:
      then:
        - climate.pid.reset_integral_term: climate_control2
    entity_category: config

time:
  - platform: homeassistant
    id: ha_time

display:
  - platform: pvvx_mithermometer
    id: pvvx_display1
    ble_client_id: display1
    update_interval: never
    validity_period: ${display_validity_period}
    disconnect_delay: 3s
    time_id: ha_time
    lambda: |-
      double temp = id(climate_control1).current_temperature;
      double target = id(climate_control1).target_temperature;
      double humidity = id(climate_control1).current_humidity;
      it.print_bignum(temp);
      if (fabs(temp - target) <= 0.2) {
        it.print_unit(pvvx_mithermometer::UNIT_LINES);
      } else {
        it.print_unit(pvvx_mithermometer::UNIT_DEG_C);
      }
      it.print_smallnum(humidity);
      it.print_percent(true);
      if (fabs(temp - target) > 2 || humidity > 60.0) {
        it.print_sad();
      } else {
        it.print_happy();
      }

  - platform: pvvx_mithermometer
    id: pvvx_display2
    ble_client_id: display2
    update_interval: never
    disconnect_delay: 3s
    validity_period: ${display_validity_period}
    time_id: ha_time
    lambda: |-
      double temp = id(climate_control2).current_temperature;
      double target = id(climate_control2).target_temperature;
      double humidity = id(climate_control2).current_humidity;
      it.print_bignum(temp);
      if (fabs(temp - target) <= 0.2) {
        it.print_unit(pvvx_mithermometer::UNIT_LINES);
      } else {
        it.print_unit(pvvx_mithermometer::UNIT_DEG_C);
      }
      it.print_smallnum(humidity);
      it.print_percent(true);
      if (fabs(temp - target) > 2 || humidity > 60.0) {
        it.print_sad();
      } else {
        it.print_happy();
      }
      
binary_sensor:
  - platform: status
    name: "Node status"
  
  - platform: template
    id: sensor1_connected
    name: "Channel 1 Sensor State"
    device_class: connectivity
    lambda: "return !isnan(id(probe1_temperature).state);"
    filters:
      - delayed_off: 5s
    on_release:
      then:
        - if:
            condition:
              - lambda: "return id(climate_control1).mode != CLIMATE_MODE_OFF;"
            then:
              - script.execute: trigger_alarm
    on_state_change:
      then:
        - script.execute:
            id: update_leds
            channel: 1
    
  - platform: template
    id: sensor2_connected
    name: "Channel 2 Sensor State"
    device_class: connectivity
    lambda: "return !isnan(id(probe2_temperature).state);"
    filters:
      - delayed_off: 5s
    on_release:
      then:
        - if:
            condition:
              - lambda: "return id(climate_control2).mode != CLIMATE_MODE_OFF;"
            then:
              - script.execute: trigger_alarm
    on_state_change:
      then:
        - script.execute:
            id: update_leds
            channel: 2

  - platform: template
    id: relay1_runaway
    name: "Channel 1 SSR Status"
    device_class: problem
    on_state_change:
      then:
        - if:
            condition:
              - lambda: "return !x;"
            then:
              - script.execute: trigger_alarm
        - script.execute:
            id: update_leds
            channel: 1

  - platform: template
    id: relay2_runaway
    name: "Channel 2 SSR Status"
    device_class: problem
    on_state_change:
      then:
        - if:
            condition:
              - lambda: "return !x;"
            then:
              - script.execute: trigger_alarm
        - script.execute:
            id: update_leds
            channel: 2

sensor:
  - platform: internal_temperature
    name: "Internal Temperature"
    disabled_by_default: true
  
  - platform: wifi_signal
    name: "WLAN RSSI"
    update_interval: 60s

  - platform: template
    id: heat_level1
    name: "Channel 1 Heat Output"
    icon: "mdi:radiator"
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 100.0
      - round: 1

  - platform: pid_autotune
    climate_id: climate_control1
    rules: NO_OVERSHOOT_PID
    phase:
      name: "Channel 1 Autotune Phase"
    kp:
      id: pid_kp1
      filters:
        - round: 5
      on_value:
        then:
          - number.set:
              id: climate_control1_kp
              value: !lambda return x;
    ki:
      id: pid_ki1
      filters:
        - round: 5
      on_value:
        then:
          - number.set:
              id: climate_control1_ki
              value: !lambda return x;
    kd:
      id: pid_kd1
      filters:
        - round: 5
      on_value:
        then:
          - number.set:
              id: climate_control1_kd
              value: !lambda return x;
    update_interval: 5s

  - platform: pid_autotune
    climate_id: climate_control2
    rules: NO_OVERSHOOT_PID
    phase:
      name: "Channel 2 Autotune Phase"
    kp:
      id: pid_kp2
      filters:
        - round: 5
      on_value:
        then:
          - number.set:
              id: climate_control2_kp
              value: !lambda return x;
    ki:
      id: pid_ki2
      filters:
        - round: 5
      on_value:
        then:
          - number.set:
              id: climate_control2_ki
              value: !lambda return x;
    kd:
      id: pid_kd2
      filters:
        - round: 5
      on_value:
        then:
          - number.set:
              id: climate_control2_kd
              value: !lambda return x;
    update_interval: 5s

  - platform: pid
    name: "Channel 1 PID Result"
    type: RESULT
    climate_id: climate_control1
    entity_category: diagnostic
    
  - platform: template
    id: heat_level2
    name: "Channel 2 Heat Output"
    icon: "mdi:radiator"
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 100.0
      - round: 1

  - platform: pid
    name: "Channel 2 PID Result"
    type: RESULT
    climate_id: climate_control2
    entity_category: diagnostic
    
  - platform: dht
    pin:
      number: ${temperature_probe1_pin}
      mode:
        input: true
        pullup: false
    model: AM2302
    temperature:
      id: probe1_temperature
      filters:
         - exponential_moving_average:
            alpha: 0.2
            send_every: ${oversampling}
      on_raw_value:
        then:
          - if:
              condition:
                - lambda: "return isnan(x);"
              then:
                - switch.turn_off: sensor1_power
                - delay: 3s
                - switch.turn_on: sensor1_power
    humidity:
      name: "Channel 1 Humidity"
      id: probe1_humidity
      accuracy_decimals: 1
      filters:
        - exponential_moving_average:
            alpha: 0.2
            send_every: ${oversampling}
        - or:
            - throttle: 30s
            - delta: 0.2
    update_interval: ${measure_interval}

  - platform: copy
    source_id: probe1_temperature
    name: "Channel 1 Temperature"
    accuracy_decimals: 2
    filters:
      - or:
          - throttle: 30s
          - delta: 0.2

  - platform: copy
    id: probe1_display_temperature
    source_id: probe1_temperature
    filters:
      - or:
          - delta: ${display_temperature_delta}
          - heartbeat: ${display_heartbeat}
    on_value:
      then:
        - script.execute: queue_display1_update

  - platform: copy
    id: probe1_display_humidity
    source_id: probe1_humidity
    filters:
      - or:
          - delta: ${display_humidity_delta}
          - heartbeat: ${display_heartbeat}
    on_value:
      then:
        - script.execute: queue_display1_update
            
  - platform: bthome_mithermometer
    mac_address: ${display1_mac}
    temperature:
      name: "Display 1 Temperature"
    humidity:
      name: "Display 1 Humidity"
    battery_level:
      name: "Display 1 Battery Level"
    signal_strength:
      name: "Display 1 Signal"
      disabled_by_default: true

  - platform: bthome_mithermometer
    mac_address: ${display2_mac}
    temperature:
      name: "Display 2 Temperature"
    humidity:
      name: "Display 2 Humidity"
    battery_level:
      name: "Display 2 Battery Level"
    signal_strength:
      name: "Display 2 Signal"
      disabled_by_default: true
      
  - platform: dht
    pin:
      number: ${temperature_probe2_pin}
      mode:
        input: true
        pullup: false
    model: AM2302
    temperature:
      id: probe2_temperature
      filters:
        - exponential_moving_average:
            alpha: 0.2
            send_every: ${oversampling}
      on_raw_value:
        then:
          - if:
              condition:
                - lambda: "return isnan(x);"
              then:
                - switch.turn_off: sensor2_power
                - delay: 3s
                - switch.turn_on: sensor2_power
    humidity:
      name: "Channel 2 Humidity"
      id: probe2_humidity
      accuracy_decimals: 1
      filters:
        - exponential_moving_average:
            alpha: 0.2
            send_every: ${oversampling}
        - or:
            - throttle: 30s
            - delta: 0.2
    update_interval: ${measure_interval}

  - platform: copy
    source_id: probe2_temperature
    name: "Channel 2 Temperature"
    accuracy_decimals: 2
    filters:
      - or:
          - throttle: 30s
          - delta: 0.2

  - platform: copy
    id: probe2_display_temperature
    source_id: probe2_temperature
    filters:
      - or:
          - delta: ${display_temperature_delta}
          - heartbeat: ${display_heartbeat}
    on_value:
      then:
        - script.execute: queue_display2_update

  - platform: copy
    id: probe2_display_humidity
    source_id: probe2_humidity
    filters:
      - or:
          - delta: ${display_humidity_delta}
          - heartbeat: ${display_heartbeat}
    on_value:
      then:
        - script.execute: queue_display2_update
            
switch:
  - platform: gpio
    pin: ${temperature_probe1_power_pin}
    id: sensor1_power
    restore_mode: ALWAYS_ON
  
  - platform: gpio
    pin: ${temperature_probe2_power_pin}
    id: sensor2_power
    restore_mode: ALWAYS_ON

  - platform: pid_autotune
    name: "Channel 1 Autotune"
    climate_id: climate_control1

  - platform: pid_autotune
    name: "Channel 2 Autotune"
    climate_id: climate_control2

  - platform: template
    id: manual_override1
    name: "Channel 1 Manual Override"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - climate.control:
          id: climate_control1
          mode: "OFF"
      - delay: 100ms
      - output.set_level:
          id: heat_monitor_proxy1
          level: 1.0
    turn_off_action:
      - output.set_level:
          id: heat_monitor_proxy1
          level: 0.0

  - platform: template
    id: manual_override2
    name: "Channel 2 Manual Override"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - climate.control:
          id: climate_control2
          mode: "OFF"
      - delay: 100ms
      - output.set_level:
          id: heat_monitor_proxy2
          level: 1.0
    turn_off_action:
      - output.set_level:
          id: heat_monitor_proxy2
          level: 0.0
          
number:
